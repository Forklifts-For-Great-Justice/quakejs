<!DOCTYPE html>
<html>
	<head>
		<title>QuakeJS Local</title>
		<link rel="stylesheet" href="login.css"></link>
  </head>
  <body>
    <div class="login">
      <label for="name">Player</label>
      <input type="text" id="name" placeholder="player">
      <label for="team">Team</label>
      <input type="text" id="team" placeholder="team">

      <button id="fight">Fight!</button>
    </div>

    <script>

    function $(v) {
      return document.getElementById(v)
    }

    document.addEventListener("DOMContentLoaded", () => {
      let n = localStorage.getItem("name");
      let t = localStorage.getItem("team");

      if (n !== null) {
        $("name").value = n;
      }

      if (t !== null) {
        $("team").value = t;
      }
    });

    function save() {
      localStorage.setItem("name", $("name").value);
      localStorage.setItem("team", $("team").value);
    }

    
    function submit() {
      save();
      // XXX: Save names to cookies?
      let name = $("name").value;
      let team = $("team").value;
      let handle = `[${team}] ${name}`;

      let fight = document.location.protocol + "//" + document.location.host + `/quake.html?name=${handle}`;

      document.location.assign(fight);
    }

    $("name").addEventListener("keydown", (e) => { if (e.code == "Enter") { submit() } })
    $("team").addEventListener("keydown", (e) => { if (e.code == "Enter") { submit() } })

    $("name").addEventListener("blur", save);
    $("team").addEventListener("blur", save);
    $("fight").addEventListener("click", submit);
    </script>
  </body>
</html>
